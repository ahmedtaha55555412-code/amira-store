name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      # Data layer is Drizzle ORM + PostgreSQL/Neon since PHASE_02 (Prisma removed).
      # Schema type-safety comes from src/db/schema; no client generation step needed.

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # Unit/integration test steps are added in the phases that introduce tests
      # (PHASE_02+, per docs/phases/). Do not weaken this workflow to pass a phase.
