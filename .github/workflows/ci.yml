name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      # Bun blocks @prisma/client's postinstall on CI (trustedDependencies policy),
      # so the client must be generated explicitly or `tsc --noEmit` fails on
      # src/lib/db.ts (TS2305). Scaffold-era helper only — Prisma is NOT the
      # Amira Store data layer (PHASE_02 introduces Drizzle; revisit then).
      - name: Generate Prisma client (scaffold helper)
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # Unit/integration test steps are added in the phases that introduce tests
      # (PHASE_02+, per docs/phases/). Do not weaken this workflow to pass a phase.
