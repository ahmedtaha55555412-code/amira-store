name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (PHASE-14 workflow-security hardening): the verify job only
# reads the repository. Repo default workflow permissions are also set to
# "read" (verified 2026-09-30); this declaration makes the guarantee explicit
# and independent of repo settings. No job in this workflow needs id-token or
# any write permission — deployments run through the Vercel Git integration,
# not through GitHub Actions.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout — v4 line, pinned to the v4 tag's commit SHA
        # (supply-chain hardening per PHASE-14; resolved via the GitHub API).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        # oven-sh/setup-bun — v2 line, pinned to the v2 tag's commit SHA.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the development-runtime Bun version for CI/local parity
          # (floating "latest" is a reproducibility risk; PHASE-14 §15).
          bun-version: 1.3.14

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      # Data layer is Drizzle ORM + PostgreSQL/Neon since PHASE_02 (Prisma removed).
      # Schema type-safety comes from src/db/schema; no client generation step needed.

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # Deterministic type/lint/build gates are mandatory in CI. The repository's
      # verify:* regression suites require a disposable PostgreSQL (embedded-postgres)
      # and, for the HTTP suites, a running app server — they are the documented
      # ENVIRONMENT-DEPENDENT verification layer and run outside CI per phase gates
      # (docs/ops/DEPLOYMENT_RUNBOOK.md). They are never weakened to pass a phase;
      # the latest full-battery evidence is recorded in EXECUTION_STATUS.md.
